<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية ❤️</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg, #1a1a1a, #4b0082);
    color:white;
    height:100vh;
    overflow:hidden;
}

/* الصفحات (توسيط مضبوط 100%) */
.page {
    display:none;
    position:fixed;

    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:90vw;
    max-width:420px;

    background: rgba(255,255,255,0.08);
    padding:18px;
    border-radius:18px;
    backdrop-filter: blur(10px);

    box-sizing:border-box;
    text-align:center;
}

/* أول صفحة */
#start {
    display:block;
}

h2 {
    font-size:22px;
}

button {
    padding:12px;
    border:none;
    border-radius:10px;
    background: gold;
    font-size:16px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
}

input {
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    width:100%;
    font-size:15px;
    text-align:center;
}

/* النصوص */
.morning {
    font-size:18px;
    line-height:1.8;
}

.sorry {
    font-size:16px;
    line-height:1.7;
    color:#ffd6d6;
}

.annoy {
    font-size:28px;
    color:#ffcc00;
    text-shadow:0 0 10px #ffcc00;
}

.love {
    font-size:30px;
    color:#ff4d6d;
    text-shadow:0 0 15px #ff4d6d;
    white-space:nowrap;
}

/* قلوب */
.heart {
    position:absolute;
    width:12px;
    height:12px;
    background:#ff2d55;
    transform: rotate(-45deg);
    top:-20px;
    animation: fall linear;
}

.heart::before,
.heart::after {
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    background:#ff2d55;
    border-radius:50%;
}

.heart::before { top:-6px; left:0; }
.heart::after { left:6px; }

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); }
}

#error {
    color:#ff6666;
    display:none;
}
</style>
</head>

<body>

<!-- 1 -->
<div id="start" class="page">
    <h2>😉 عندي ليكي حاجه</h2>
    <button onclick="goToLogin()">اتفصلي</button>
</div>

<!-- 2 -->
<div id="login" class="page">
    <h2>🔒 الباسورد</h2>

    <p style="color:#ffcccc; font-size:15px;">
       😉 أكيد هتعرفي الباسورد 😉
    </p>

    <input type="password" id="password">
    <button onclick="check()">دخول</button>
    <p id="error">كلمة السر غلط</p>
</div>

<!-- 3 -->
<div id="morning" class="page">
    <div class="morning">
        🌤 صباح الخير يا أجمل حاجة في حياتي ❤️
    </div>
    <button onclick="goToSorry()">اكمل</button>
</div>

<!-- 4 -->
<div id="sorry" class="page">
    <div class="sorry">
        💔 أنا آسف على كل حاجة فاتت 💔<br><br>
        لو ضايقتك أو جرحتك فده كان غصب عني <br><br>
        ❤️ كل اللي فات كان غلط، بس مشاعري كانت حقيقية ❤️
    </div>
    <button onclick="goToAnnoy()">اكمل</button>
</div>

<!-- 5 -->
<div id="annoy" class="page">
    <div class="annoy">
        وأخيرًا<br>
        انتي إنسانة مستفزة
    </div>
    <button onclick="goToLove()">اكمل</button>
</div>

<!-- 6 -->
<div id="love" class="page">
    <div class="love">❤️ بحبك يا أحلى ميرو ❤️</div>
</div>

<!-- أغنية -->
<audio id="music" src="100.mp3" loop></audio>

<script>

const pass = "1442024"; // 🔐 التغيير الوحيد
let heartsStarted = false;

function show(page){
    document.querySelectorAll('.page').forEach(p => p.style.display="none");
    document.getElementById(page).style.display="block";
}

function goToLogin(){
    show("login");
}

function check(){
    let input = password.value;

    if(input === pass){
        show("morning");

        let music = document.getElementById("music");
        music.play().catch(()=>{});

    } else {
        error.style.display="block";
    }
}

function goToSorry(){
    show("sorry");
}

function goToAnnoy(){
    show("annoy");
}

function goToLove(){
    show("love");

    if(!heartsStarted){
        setInterval(createHeart, 180);
        heartsStarted = true;
    }
}

function createHeart(){
    let h = document.createElement("div");
    h.className="heart";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
}

</script>

</body>
</html>
