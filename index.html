<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>هدية</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg, #1a1a1a, #4b0082);
    color:white;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* الصفحات */
.page {
    display:none;
    width:90%;
    max-width:500px;
}

/* أول صفحة */
#start {
    display:block;
}

/* عنوان */
h2 {
    font-size:28px;
}

/* زرار */
button {
    padding:15px 25px;
    border:none;
    border-radius:15px;
    background: gold;
    cursor:pointer;
    font-size:18px;
    width:100%;
    max-width:300px;
}

/* input */
input {
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    width:100%;
    max-width:300px;
    font-size:16px;
}

/* صباح */
.morning {
    font-size:26px;
    line-height:1.8;
}

/* اعتذار */
.sorry {
    font-size:22px;
    line-height:1.8;
    color:#ffcccc;
}

/* بحبك */
.love-text {
    font-size:70px;
    color:#ff4d6d;
    text-shadow:0 0 20px #ff4d6d;
}

/* القلوب */
.heart {
    position:absolute;
    width:15px;
    height:15px;
    background:red;
    transform: rotate(-45deg);
    top:-20px;
    animation: fall linear;
}

.heart::before,
.heart::after {
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    background:red;
    border-radius:50%;
}

.heart::before { top:-8px; left:0; }
.heart::after { left:8px; }

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); }
}

/* error */
#error {
    color:red;
    display:none;
}
</style>
</head>

<body>

<!-- 1 -->
<div id="start" class="page">
    <h2>😉 عندي ليكي حاجه</h2>
    <button onclick="goToLogin()">اتفصلي</button>
</div>

<!-- 2 -->
<div id="login" class="page">
    <h2>🔒 ادخل كلمة السر</h2>
    <p style="color:#ffcccb;">معلش تقل دم مني 😅 اكتبي الباسورد</p>
    <input type="password" id="password">
    <br>
    <button onclick="check()">دخول</button>
    <p id="error">كلمة السر غلط</p>
</div>

<!-- 3 -->
<div id="morning" class="page">
    <div class="morning">
        🌤 صباح الخير يا أجمل حاجة في حياتي ❤️
    </div>
    <br>
    <button onclick="goToSorry()">اكمل</button>
</div>

<!-- 4 -->
<div id="sorry" class="page">
    <div class="sorry">
        💔 أنا آسف على كل حاجة فاتت 💔<br><br>
        لو ضايقتك في يوم أو جرحتك<br>
        فده كان غصب عني 😔<br><br>
        كل اللي فات كان غلط، بس مشاعري كانت حقيقية ❤️
    </div>
    <br>
    <button onclick="goToLove()">اكمل</button>
</div>

<!-- 5 -->
<div id="home" class="page">
    <div class="love-text">❤️ بحبك ❤️</div>
</div>

<!-- الأغنية -->
<audio id="music" src="100.mp3" loop></audio>

<script>

const pass = "1234";
let heartsStarted = false;

// 1
function goToLogin(){
    start.style.display="none";
    login.style.display="block";
}

// 2
function check(){
    let input = password.value;

    if(input === pass){
        login.style.display="none";
        morning.style.display="block";
    } else {
        error.style.display="block";
    }
}

// 3 → 4
function goToSorry(){
    morning.style.display="none";
    sorry.style.display="block";
}

// 4 → 5
function goToLove(){
    sorry.style.display="none";
    home.style.display="block";

    music.play();

    if(!heartsStarted){
        setInterval(createHeart, 200);
        heartsStarted = true;
    }
}

// قلوب
function createHeart(){
    let h = document.createElement("div");
    h.className="heart";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
}

</script>

</body>
</html>
